server:
  port: 8089

spring:
  application:
    name: aggregator-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aggregator-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      # value-deserializer будет добавлен позже (кастомный Avro)
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      # value-serializer будет добавлен позже (кастомный Avro)
      acks: all

app:
  kafka:
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.kafka: INFO