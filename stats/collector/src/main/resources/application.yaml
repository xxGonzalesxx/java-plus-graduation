server:
  port: 8088

spring:
  application:
    name: collector
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      acks: all
      retries: 3
  grpc:
    server:
      port: 40612
      security:
        enabled: false
        certificate-chain: classpath:grpc-keystore.p12
        private-key: classpath:grpc-keystore.p12
        key-store-type: PKCS12
        key-store-password: changeit
        key-alias: grpc-server

app:
  kafka:
    topics:
      user-actions: stats.user-actions.v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    metadata-map:
      grpcPort: ${spring.grpc.server.port:40612}

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.kafka: DEBUG
    org.apache.kafka: DEBUG