spring:
  application:
    name: collector
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    initial-instance-info-replication-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5                    # ← добавить!
    lease-expiration-duration-in-seconds: 10                # ← добавить!
    metadata-map:
      grpcPort: "0"

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.kafka: INFO