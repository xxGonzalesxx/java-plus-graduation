# ==================== REQUEST-SERVICE (ПЕРВЫЙ!) ====================
spring.cloud.gateway.server.webflux.routes[0].id=request-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://REQUEST-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/{userId}/events/{eventId}/requests/**,/users/{userId}/requests/**

# ==================== COMMENT-SERVICE ====================
spring.cloud.gateway.server.webflux.routes[1].id=comment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/{userId}/events/{eventId}/comments/**,/users/{userId}/comments/**,/comments/**,/admin/comments/**

# ==================== EVENT-SERVICE (БЕЗ /users/*/events/**!) ====================
spring.cloud.gateway.server.webflux.routes[2].id=event-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/events/**,/admin/events/**,/compilations/**,/admin/compilations/**

# ==================== CATEGORY-SERVICE ====================
spring.cloud.gateway.server.webflux.routes[3].id=category-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/categories/**,/admin/categories/**

# ==================== USER-SERVICE (САМЫЙ ОБЩИЙ - ПОСЛЕДНИЙ!) ====================
spring.cloud.gateway.server.webflux.routes[4].id=user-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/users/**,/admin/users/**