spring:
  application:
    name: event-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: false
  main:
    allow-bean-definition-overriding: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/event
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

grpc:
  client:
    GLOBAL:
      negotiationType: plaintext

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics,loggers
    enabled-by-default: true
  endpoint:
    health:
      show-details: always
    mappings:
      enabled: true
    metrics:
      enabled: true
    info:
      enabled: true

format:
  pattern:
    datetime: yyyy-MM-dd HH:mm:ss

stats-client:
  retry:
    backoff-period: 3000
    max-attempts: 3