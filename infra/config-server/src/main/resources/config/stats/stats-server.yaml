server:
  port: 9090

spring:
  application:
    name: stats-server                        # ← добавлено
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://stats-db:5432/stats   # ← исправлено
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

format:
  pattern:
    datetime: yyyy-MM-dd HH:mm:ss

stats-client:
  retry:
    backoff-period: 3000
    max-attempts: 3

eureka:                                     # ← добавлен блок (если его не было)
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

