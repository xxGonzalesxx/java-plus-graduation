spring:
  application:
    name: user-service
  cloud:
    config:
      import: "optional:configserver:"
      discovery:
        enabled: false
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000
        max-interval: 5000
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/users
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true

logging:
  level:
    ru:
      practicum: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics,loggers
    enabled-by-default: true
  endpoint:
    health:
      show-details: always
    mappings:
      enabled: true
    metrics:
      enabled: true
    info:
      enabled: true