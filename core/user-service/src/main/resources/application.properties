spring.config.import=optional:configserver:
spring.application.name=user-service
server.port=0

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true

spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-interval=5000

logging.level.ru.practicum=DEBUG

# Actuator настройки
management.endpoints.web.exposure.include=health,info,mappings,metrics,loggers
management.endpoints.enabled-by-default=true
management.endpoint.health.show-details=always
management.endpoint.mappings.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true