spring:
  application:
    name: category-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: false
      fail-fast: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/category
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics,loggers
    enabled-by-default: true
  endpoint:
    health:
      show-details: always
    mappings:
      enabled: true
    metrics:
      enabled: true
    info:
      enabled: true